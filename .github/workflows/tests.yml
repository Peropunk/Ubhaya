name: Cross-platform tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install, load the demo and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup_offline.ps1
      - name: Install, load the demo and test on Linux
        if: runner.os == 'Linux'
        run: bash scripts/setup_offline.sh
